<script id="beam-collapse-rightbar-boot">
(() => {
  if (window.__beamCollapseRightbarBoot) return;
  window.__beamCollapseRightbarBoot = true;

  const scrub = () => {
    try {
      for (const key of Object.keys(localStorage)) {
        if (!/^(beam|dsh)\.sidebar-right\.v1\./.test(key)) continue;
        let raw = localStorage.getItem(key);
        if (!raw) continue;
        let data;
        try { data = JSON.parse(raw); } catch { continue; }
        let changed = false;
        for (const surface of Object.values(data.bySession || {})) {
          if (surface?.layout && surface.layout.expanded !== false) {
            surface.layout.expanded = false;
            changed = true;
          }
        }
        if (changed) localStorage.setItem(key, JSON.stringify(data));
      }
    } catch (e) {
      console.warn("[beam-collapse-rightbar] scrub", e);
    }
  };

  // Before React reads persistence
  scrub();

  const collapseUi = () => {
    try {
      const btn = [...document.querySelectorAll("button")].find((b) => {
        const t = ((b.getAttribute("aria-label") || "") + " " + (b.getAttribute("title") || "")).trim();
        return /свернуть right sidebar|collapse right sidebar|toggle right sidebar|sidebar\.right\.toggle/i.test(t)
          || (/свернуть/i.test(t) && /right sidebar/i.test(t));
      });
      if (btn) {
        btn.click();
        return true;
      }
      // fallback: if column is wide and Start guide is visible, click any known toggle
      const col = document.querySelector("[data-rightbar-col='true'], [data-slot='rightbar']");
      const w = col?.getBoundingClientRect?.().width || 0;
      if (w > 120) {
        const alt = [...document.querySelectorAll("button")].find((b) =>
          /right sidebar/i.test(b.getAttribute("aria-label") || "")
        );
        if (alt) { alt.click(); return true; }
      }
    } catch (e) {
      console.warn("[beam-collapse-rightbar] ui", e);
    }
    return false;
  };

  let tries = 0;
  const tick = () => {
    tries += 1;
    // Only collapse once at boot if still open (persistence race / late expand)
    const col = document.querySelector("[data-rightbar-col='true'], [class*='rightbarCol']");
    const wide = (col?.getBoundingClientRect?.().width || 0) > 160;
    if (wide) collapseUi();
    if (tries < 20 && wide) setTimeout(tick, 400);
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => setTimeout(tick, 800));
  } else {
    setTimeout(tick, 800);
  }
})();
</script>

<script id="beam-locale-bootstrap">
(() => {
  /* Preference from storage/Host wins; otherwise follow device language (ru/en). */
  try {
    let pref = null;
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i) || "";
      const v = localStorage.getItem(key) || "";
      const m = v.match(/"preference"\s*:\s*"(ru|en)"/) || v.match(/preference["']?\s*:\s*["'](ru|en)["']/);
      if (m) { pref = m[1]; break; }
    }
    if (!pref) {
      try {
        const ds = document.documentElement.dataset.beamLang;
        if (ds === "en" || ds === "ru") pref = ds;
      } catch {}
    }
    if (!pref || pref === "zh") {
      const langs = [];
      try {
        if (navigator.language) langs.push(String(navigator.language));
        if (navigator.userLanguage) langs.push(String(navigator.userLanguage));
        for (const l of (navigator.languages || [])) langs.push(String(l));
      } catch {}
      pref = langs.some((l) => String(l || "").toLowerCase().startsWith("ru")) ? "ru" : "en";
    }
    document.documentElement.lang = pref === "ru" ? "ru-RU" : "en";
    document.documentElement.dataset.beamLang = pref === "ru" ? "ru" : "en";
  } catch {
    try {
      const nav = String(navigator.language || "").toLowerCase();
      const ru = nav.startsWith("ru");
      document.documentElement.lang = ru ? "ru-RU" : "en";
      document.documentElement.dataset.beamLang = ru ? "ru" : "en";
    } catch {
      document.documentElement.lang = "en";
      document.documentElement.dataset.beamLang = "en";
    }
  }
})();
</script>

      const r = el.getBoundingClientRect();
      if (r.width <= 0 || r.height <= 0) continue;
      left = Math.min(left, r.left);
      right = Math.max(right, r.right);
      top = Math.min(top, r.top);
      bottom = Math.max(bottom, r.bottom);
    }
    if (!Number.isFinite(left)) return null;
    // Marks span the rail band; ticks sit on the right — use a tight right strip.
    const tickLeft = Math.max(left, right - 24);
    return { left: tickLeft, right, top, bottom };
  };

  const sync = () => {
    killLeftChrome();
    marks = [...document.querySelectorAll(markSelector)].filter((el) => {
      if (el.closest('[role="tree"], [class*="sessionRow"], [class*="projectRow"], [data-row-key], aside, [class*="sidebar"]')) return false;
      const r = el.getBoundingClientRect();
      // Right-rail ticks only
      if (r.left < window.innerWidth * 0.55) return false;
      return r.height > 0 && r.width > 0;
    });
    marks.sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top);
    if (!active) {
      for (const el of marks) clearMarkStyle(el);
    }
  };

  const gauss = (d) => Math.exp(-(d * d) / (2 * SIGMA * SIGMA));

  const resetPulls = () => {
    for (const el of marks) clearMarkStyle(el);
    proximity = 0;
    document.documentElement.removeAttribute("data-beam-right-hist");
  };

  /** 0 if far; 1 when over/near ticks; fades with horizontal distance into chat. */
  const proximityAt = (x, y) => {
    const rail = railBounds();
    if (!rail) return 0;
    if (y < rail.top - EDGE_PAD_Y || y > rail.bottom + EDGE_PAD_Y) return 0;
    if (x > rail.right + EDGE_PAD_RIGHT) return 0;
    // Distance into the chat from the rail's left edge (0 = on/over rail)
    const intoChat = rail.left - x;
    if (intoChat > PROXIMITY_X) return 0;
    if (intoChat <= 0) return 1; // on the rail or to its right (still in pad)
    return smoothstep(1 - intoChat / PROXIMITY_X);
  };

  const paint = () => {
    raf = 0;
    if (!active || !marks.length || proximity <= 0.001) {
      if (active && proximity <= 0.001) {
        active = false;
        resetPulls();
      }
      return;
    }

    let peakIdx = 0;
    let peakDist = Infinity;
    for (let i = 0; i < marks.length; i++) {
      const r = marks[i].getBoundingClientRect();
      const cy = r.top + r.height / 2;
      const dist = Math.abs(lastY - cy);
      if (dist < peakDist) {
        peakDist = dist;
        peakIdx = i;
      }
    }

    const s = proximity; // horizontal strength multiplies elongation + whiteness
    for (let i = 0; i < marks.length; i++) {
      const el = marks[i];
      const d = Math.abs(i - peakIdx);
      if (d === 0) {
        const pull = PULL_FLOOR + s * PULL_SPAN; // max 1.0 only at full proximity
        el.style.setProperty("--beam-pull", pull.toFixed(3));
        el.style.setProperty("--beam-hot", s.toFixed(3));
        el.setAttribute("data-beam-peak", "1");
        el.setAttribute("data-beam-hot", s > 0.85 ? "1" : "0");
        continue;
      }
      const w = gauss(d);
      const pull = PULL_FLOOR + s * w * PULL_SPAN * 0.72;
      const hot = Math.min(HOT_NEIGHBOR_CAP, s * w * w * 0.55);
      el.style.setProperty("--beam-pull", pull.toFixed(3));
      el.style.setProperty("--beam-hot", hot.toFixed(3));
      el.removeAttribute("data-beam-peak");
      el.setAttribute("data-beam-hot", "0");
    }
  };

  const schedule = () => { if (!raf) raf = requestAnimationFrame(paint); };

  const onMove = (ev) => {
    if (!marks.length) return;
    lastX = ev.clientX;
    lastY = ev.clientY;
    const next = proximityAt(lastX, lastY);
    proximity = next;
    if (next > 0) {
      if (!active) {
        active = true;
        document.documentElement.setAttribute("data-beam-right-hist", "1");
      }
      schedule();
    } else if (active) {
      active = false;
      resetPulls();
    }
  };

  const refresh = () => {
    sync();
    if (active) {
      proximity = proximityAt(lastX, lastY);
      if (proximity > 0) schedule();
      else {
        active = false;
        resetPulls();
      }
    }
  };

  const arm = () => {
    killLeftChrome();
    refresh();
    document.addEventListener("pointermove", onMove, { passive: true });
    document.addEventListener("scroll", refresh, { passive: true, capture: true });
    window.addEventListener("resize", refresh);
    new MutationObserver(() => {
      clearTimeout(moTimer);
      moTimer = setTimeout(refresh, 140);
    }).observe(document.documentElement, { childList: true, subtree: true });
    setInterval(refresh, 5000);
  };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", arm);
  else arm();
})();
</script>
<script>
/* beam-auto-presend-hook */
(function () {
  try {
    if (!localStorage.getItem("beam.modelPrefs")) {
      localStorage.setItem("beam.modelPrefs", JSON.stringify({ auto: true, lastManual: "tide" }));
    }
  } catch {}
  const sync = () => {
    fetch("http://127.0.0.1:17865/assistix/model-prefs").then((r) => r.json()).then((j) => {
      if (!j || typeof j.auto !== "boolean") return;
      try { localStorage.setItem("beam.modelPrefs", JSON.stringify(j)); } catch {}
      window.__beamModelPrefs = j;
      window.dispatchEvent(new CustomEvent("beam:model-prefs", { detail: j }));
    }).catch(() => {});
  };
  sync();
  setInterval(sync, 60000);

  /* Soft-block send when selected model weekly quota is exhausted (no LLM spam). */
  const names = { tide: "Tide", flare: "Flare", pine: "Pine" };
  const selectedModelId = () => {
    try {
      const prefs = window.__beamModelPrefs || JSON.parse(localStorage.getItem("beam.modelPrefs") || "{}");
      if (prefs && prefs.auto === false && prefs.lastManual) return String(prefs.lastManual).toLowerCase();
    } catch {}
    const pill = document.querySelector('[class*="modelSelect"], [class*="ModelSelect"], button[aria-haspopup="listbox"]');
    const t = ((pill && (pill.textContent || pill.getAttribute("aria-label"))) || "").toLowerCase();
    if (/\bpine\b/.test(t)) return "pine";
    if (/\bflare\b|\bflair\b/.test(t)) return "flare";
    if (/\btide\b/.test(t)) return "tide";
    return "tide";
  };
  const exhaustedMsg = (id, used, limit, alts) => {
    const ru = (document.documentElement.lang || navigator.language || "").toLowerCase().startsWith("ru");
    const when = "Monday 00:00 UTC";
    const altTxt = alts.length
      ? (ru ? (" Можно переключиться на " + alts.join(" или ") + " — там ещё есть лимит.")
            : (" You can switch to " + alts.join(" or ") + " — quota remains."))
      : (ru ? " У всех моделей лимит на этой неделе исчерпан." : " All models are exhausted for this week.");
    if (ru) {
      return "Лимит " + (names[id] || id) + " на этой неделе исчерпан (" + used + "/" + limit + "). Запросы остановлены до обновления (" + when + ")." + altTxt;
    }
    return (names[id] || id) + " weekly limit exhausted (" + used + "/" + limit + "). Requests paused until reset (" + when + ")." + altTxt;
  };
  const checkExhausted = () => {
    const st = window.__beamAssistixStatus || {};
    const id = selectedModelId();
    if (st.quotaServer && (st.quotaServer.unlimited || st.quotaServer.unlimitedByTier?.[id])) return null;
    const models = st.models || [];
    const qmap = st.quotas || {};
    const row = models.find((m) => m && m.id === id) || null;
    if (row?.unlimited || qmap?.[id]?.unlimited) return null;
    const used = Number(row?.used ?? qmap?.[id]?.used) || 0;
    let limit = Number(row?.limit ?? qmap?.[id]?.limit);
    if (!Number.isFinite(limit) || limit <= 1 || limit >= 1e9) return null;
    if (!(used >= limit)) return null;
    const alts = ["tide", "flare", "pine"].filter((x) => x !== id).filter((x) => {
      const m = models.find((z) => z && z.id === x);
      const u = Number(m?.used ?? qmap?.[x]?.used) || 0;
      const lim = Number(m?.limit ?? qmap?.[x]?.limit) || ({ tide: 5e5, flare: 1e5, pine: 1e4 }[x] || 1);
      return u < lim;
    }).map((x) => names[x] || x);
    return exhaustedMsg(id, used, limit, alts);
  };
  const showBanner = (msg) => {
    try {
      let el = document.getElementById("beam-quota-softblock");
      if (!el) {
        el = document.createElement("div");
        el.id = "beam-quota-softblock";
        el.setAttribute("role", "alert");
        el.style.cssText = "position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:2147483000;max-width:min(560px,92vw);padding:12px 14px;border-radius:12px;background:#0b2a24;color:#e7fffa;border:1px solid #1f6f64;box-shadow:0 12px 40px rgba(0,0,0,.35);font:13px/1.45 Segoe UI,system-ui,sans-serif;";
        document.body.appendChild(el);
      }
      el.textContent = msg;
      el.hidden = false;
      clearTimeout(showBanner._t);
      showBanner._t = setTimeout(() => { try { el.hidden = true; } catch {} }, 8000);
    } catch {}
  };
  const blockIfExhausted = (ev) => {
    const msg = checkExhausted();
    if (!msg) return false;
    try { ev.preventDefault(); ev.stopPropagation(); ev.stopImmediatePropagation(); } catch {}
    showBanner(msg);
    return true;
  };
  document.addEventListener("keydown", (ev) => {
    if (ev.key !== "Enter" || ev.shiftKey || ev.isComposing) return;
    const t = ev.target;
    if (!t) return;
    const tag = (t.tagName || "").toLowerCase();
    if (tag !== "textarea" && !(t.getAttribute && t.getAttribute("contenteditable") === "true")) return;
    if (!t.closest || !t.closest('[class*="composer"], [class*="Composer"], [class*="chatInput"], form, main')) return;
    blockIfExhausted(ev);
  }, true);
  document.addEventListener("click", (ev) => {
    const btn = ev.target && ev.target.closest && ev.target.closest('button, [role="button"]');
    if (!btn) return;
    const label = ((btn.getAttribute("aria-label") || "") + " " + (btn.textContent || "")).trim();
    if (!/send|отправ|➤|➜|→/i.test(label) && !btn.matches('[data-testid*="send" i], [class*="send" i]')) return;
    blockIfExhausted(ev);
  }, true);
})();
</script>


<script>
/* beam-dsh-ui-brand-scrub */
(function () {
  if (window.__BEAM_DSH_UI_BRAND_SCRUB__) return;
  window.__BEAM_DSH_UI_BRAND_SCRUB__ = true;
  function rewrite(s) {
    if (!s || typeof s !== "string") return s;
    return s
      .replace(/DeepSeek\s+Harness/gi, "Beam Agent")
      .replace(/\bDSH\b/g, "Beam")
      .replace(/(?<![A-Za-z0-9_/@.-])beam(?![A-Za-z0-9_/-])/g, "beam");
  }
  function scrubNode(n) {
    if (!n) return;
    if (n.nodeType === 3) {
      const v = n.nodeValue;
      const nv = rewrite(v);
      if (nv !== v) n.nodeValue = nv;
      return;
    }
    if (n.nodeType !== 1) return;
    const tag = (n.tagName || "").toLowerCase();
    if (tag === "script" || tag === "style" || tag === "noscript") return;
    for (const c of [...n.childNodes]) scrubNode(c);
  }
  function run() {
    try { scrubNode(document.body || document.documentElement); } catch {}
  }
  const mo = new MutationObserver(() => run());
  function start() {
    run();
    try {
      mo.observe(document.documentElement, { childList: true, subtree: true, characterData: true });
    } catch {}
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();
</script>

<script id="beam-telemetry-bridge">
(() => {
  const ENDPOINT = "http://127.0.0.1:17865/assistix/telemetry";
  const send = (ev) => {
    try {
      const body = JSON.stringify({
        ...ev,
        source: "beam-agent-ui",
        app_version: "0.1.3-early-alpha",
        href: location.href,
        at: new Date().toISOString(),
      });
      if (navigator.sendBeacon) {
        const blob = new Blob([body], { type: "application/json" });
        navigator.sendBeacon(ENDPOINT, blob);
      } else {
        fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body, keepalive: true }).catch(() => {});
      }
    } catch {}
  };
  window.__beamReport = send;

  // Thumbs / feedback buttons
  document.addEventListener("click", (e) => {
    const el = e.target?.closest?.("button,[role='button']");
    if (!el) return;
    const label = ((el.getAttribute("aria-label") || "") + " " + (el.innerText || "")).trim();
    if (/thumbs up|нравится/i.test(label)) send({ kind: "thumbs_up", subject: "Thumbs up", message: label });
    else if (/thumbs down|не нравится/i.test(label)) send({ kind: "thumbs_down", subject: "Thumbs down", message: label });
    else if (/^feedback$|обратн/i.test(label) && label.length < 40) send({ kind: "feedback", subject: "Opened feedback", message: label });
  }, true);

  // Detect Failed turns in conversation
  let lastFail = "";
  const scanFails = () => {
    try {
      const nodes = document.querySelectorAll("[class*='error'],[class*='Failed'],[data-error-code]");
      for (const n of nodes) {
        const t = (n.innerText || "").trim();
        if (!t || t.length > 500) continue;
        if (!/this turn failed|could not get a model response|MODEL_UNSUPPORTED|turn failed/i.test(t)) continue;
        if (t === lastFail) continue;
        lastFail = t;
        send({ kind: "turn_failed", level: "ERROR", subject: "UI turn failed", message: t.slice(0, 800) });
      }
    } catch {}
  };
  setInterval(scanFails, 2500);
  document.addEventListener("DOMContentLoaded", scanFails);

  // Hook window errors
  window.addEventListener("error", (ev) => {
    send({ kind: "error", level: "ERROR", subject: "Renderer error", message: String(ev?.message || ev), meta: { file: ev?.filename, line: ev?.lineno } });
  });
  window.addEventListener("unhandledrejection", (ev) => {
    send({ kind: "error", level: "ERROR", subject: "Unhandled rejection", message: String(ev?.reason?.message || ev?.reason || ev) });
  });
})();
</script>

<script id="beam-net-reconnect">
/* BEAM_NET_RECONNECT_WATCHDOG */
(function () {
  if (window.__beamNetWatchdogInstalled) return;
  window.__beamNetWatchdogInstalled = true;

  const BRIDGE = "http://127.0.0.1:17865";
  const STABLE_MS = 1500;
  const POLL_MS = 2500;
  const state = {
    browserOnline: typeof navigator !== "undefined" ? navigator.onLine !== false : true,
    bridgeOk: true,
    kumoOk: null,
    hostOk: null,
    healthySince: 0,
    stable: true,
    reconnecting: false,
    pendingResume: false,
    lastEvent: "boot",
  };

  try {
    window.__BEAM_CONNECTION_RECOVERY__ = Object.assign({}, window.__BEAM_CONNECTION_RECOVERY__ || {}, {
      backoffBaseMs: 400,
      backoffMaxMs: 8000,
    });
  } catch {}

  const publish = (evt) => {
    try {
      window.__beamNetState = { ...state, online: !!(state.browserOnline && state.bridgeOk && state.stable) };
      window.__beamNetOnline = window.__beamNetState.online;
      window.__beamBridgeDown = !state.bridgeOk;
      window.dispatchEvent(new CustomEvent(evt, { detail: window.__beamNetState }));
    } catch {}
  };

  const ensureChip = () => {
    let el = document.getElementById("beam-net-chip");
    if (el) return el;
    el = document.createElement("div");
    el.id = "beam-net-chip";
    el.setAttribute("aria-live", "polite");
    el.style.cssText = [
      "position:fixed", "left:50%", "bottom:18px", "transform:translateX(-50%)",
      "z-index:2147483640", "display:none", "align-items:center", "gap:8px",
      "padding:8px 14px", "border-radius:999px", "font:12px/1.3 Savona,Segoe UI,system-ui,sans-serif",
      "background:rgba(2,16,14,.92)", "color:#dff7f4", "border:1px solid rgba(0,179,188,.45)",
      "box-shadow:0 8px 28px rgba(0,0,0,.28)", "pointer-events:none", "letter-spacing:.01em",
    ].join(";");
    document.documentElement.appendChild(el);
    return el;
  };

  const setChip = (visible, text) => {
    try {
      const el = ensureChip();
      el.textContent = text || "";
      el.style.display = visible ? "inline-flex" : "none";
    } catch {}
  };

  const lang = () => {
    try {
      return (document.documentElement.dataset.beamLang || navigator.language || "en").toLowerCase().startsWith("ru")
        ? "ru" : "en";
    } catch { return "en"; }
  };

  const copy = {
    en: {
      offline: "No network — waiting to reconnect…",
      bridge: "Reconnecting to Beam Agent…",
      upstream: "Connection unstable — reconnecting…",
      resume: "Connection restored — continuing…",
    },
    ru: {
      offline: "Нет сети — ждём восстановления…",
      bridge: "Переподключение к Beam Agent…",
      upstream: "Связь нестабильна — переподключаемся…",
      resume: "Связь восстановлена — продолжаем…",
    },
  };

  const markUnhealthy = (reason) => {
    state.stable = false;
    state.healthySince = 0;
    state.reconnecting = true;
    state.lastEvent = reason;
    const t = copy[lang()] || copy.en;
    const msg = reason === "browser-offline" ? t.offline
      : reason === "bridge-down" ? t.bridge
      : t.upstream;
    setChip(true, msg);
    publish("beam:net-degraded");
  };

  const tryHostReconnect = () => {
    try {
      const conn = window.__dsh?.connection || window.dsh?.connection
        || window.__cordis?.connection || null;
      if (conn && typeof conn.reconnect === "function") conn.reconnect();
    } catch {}
    try {
      // Settings UI wires ConnectionIndicator via Cordis; also poke known global.
      if (typeof window.__beamHostReconnect === "function") window.__beamHostReconnect();
    } catch {}
  };

  const onStableRecovered = async () => {
    if (state.stable && !state.reconnecting && !state.pendingResume) return;
    state.stable = true;
    state.reconnecting = false;
    const t = copy[lang()] || copy.en;
    if (state.pendingResume) setChip(true, t.resume);
    else setChip(false, "");
    publish("beam:net-recovered");
    try {
      if (typeof window.__beamRefreshAssistix === "function") {
        await window.__beamRefreshAssistix({ force: true, allowSignOut: true });
      }
    } catch {}
    tryHostReconnect();
    // One deferred resume signal for in-flight generation / llm-retry waiters.
    if (state.pendingResume) {
      state.pendingResume = false;
      try {
        window.dispatchEvent(new CustomEvent("beam:net-resume-turn", { detail: window.__beamNetState }));
      } catch {}
      setTimeout(() => setChip(false, ""), 1600);
    }
  };

  const evaluate = () => {
    const upstreamKnownBad = state.kumoOk === false && state.hostOk === false;
    const componentsOk = state.browserOnline && state.bridgeOk && !upstreamKnownBad;
    if (!componentsOk) {
      markUnhealthy(!state.browserOnline ? "browser-offline" : (!state.bridgeOk ? "bridge-down" : "upstream"));
      return;
    }
    if (!state.healthySince) state.healthySince = Date.now();
    if (Date.now() - state.healthySince >= STABLE_MS) {
      onStableRecovered();
    } else if (state.reconnecting) {
      const t = copy[lang()] || copy.en;
      setChip(true, t.upstream);
    }
    publish("beam:net-tick");
  };

  const probe = async () => {
    state.browserOnline = typeof navigator === "undefined" ? true : navigator.onLine !== false;
    if (!state.browserOnline) {
      state.bridgeOk = false;
      evaluate();
      return;
    }
    let bridgeOk = false;
    let kumoOk = null;
    let hostOk = null;
    try {
      const health = await fetch(BRIDGE + "/health", { cache: "no-store" });
      if (health.ok) {
        bridgeOk = true;
        const j = await health.json().catch(() => null);
        if (j && typeof j === "object") {
          if (typeof j.kumo === "boolean") kumoOk = j.kumo;
          if (typeof j.host === "boolean") hostOk = j.host;
        }
      }
    } catch {
      bridgeOk = false;
    }
    if (bridgeOk) {
      try {
        const net = await fetch(BRIDGE + "/assistix/net", { cache: "no-store" });
        if (net.ok) {
          const j = await net.json().catch(() => null);
          if (j && typeof j === "object") {
            if (typeof j.kumo === "boolean") kumoOk = j.kumo;
            if (typeof j.host === "boolean") hostOk = j.host;
          }
        }
      } catch {}
    }
    const wasDown = !state.bridgeOk || !state.stable;
    state.bridgeOk = bridgeOk;
    state.kumoOk = kumoOk;
    state.hostOk = hostOk;
    if (wasDown && bridgeOk) state.pendingResume = true;
    evaluate();
  };

  // Simulate offline for smoke tests: window.__beamSimulateOffline(true/false)
  window.__beamSimulateOffline = (off) => {
    state.browserOnline = !off;
    if (off) {
      state.bridgeOk = false;
      state.pendingResume = true;
      markUnhealthy("browser-offline");
    } else {
      probe();
    }
  };

  window.addEventListener("online", () => {
    state.browserOnline = true;
    state.pendingResume = true;
    state.healthySince = 0;
    probe();
  });
  window.addEventListener("offline", () => {
    state.browserOnline = false;
    state.pendingResume = true;
    markUnhealthy("browser-offline");
  });

  // Generation failures while offline → queue one resume after stable reconnect.
  window.addEventListener("beam:generation-paused", () => {
    state.pendingResume = true;
    if (!state.stable) markUnhealthy(state.lastEvent || "upstream");
  });

  setInterval(probe, POLL_MS);
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", () => probe());
  else probe();
  publish("beam:net-boot");
})();
</script>


<script id="beam-cool-inline-clean">
(() => {

      const SLASH = {"file":"<svg viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\r\n<path d=\"M4 10L9 5C11.48528 2.51472 15.51472 2.51472 18 5C20.48528 7.48528 20.48528 11.51472 18 14L13 19C11.34315 20.65685 8.65685 20.65685 7 19C5.34315 17.34315 5.34315 14.65685 7 13L12 8C12.82843 7.17157 14.17157 7.17157 15 8C15.82843 8.82843 15.82843 10.17157 15 11L11 15\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\r\n</svg>","goal":"<svg viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\r\n<path d=\"M12 3V12H21C21 16.971 16.971 21 12 21C7.029 21 3 16.971 3 12C3 7.029 7.029 3 12 3Z\" fill=\"currentColor\" fill-opacity=\"0.2\"/>\r\n<path d=\"M21 12C21 16.97056 16.97056 21 12 21C7.02944 21 3 16.97056 3 12C3 7.02944 7.02944 3 12 3M17 12C17 14.76142 14.76142 17 12 17C9.23858 17 7 14.76142 7 12C7 9.23858 9.23858 7 12 7M12 12L21 3M17 3V7H21\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\r\n</svg>","plan":"<svg viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\r\n<path d=\"M3 6C3 4.895 3.895 4 5 4H7C8.105 4 9 4.895 9 6V8C9 9.105 8.105 10 7 10H5C3.895 10 3 9.105 3 8Z\" fill=\"currentColor\" fill-opacity=\"0.2\"/>\r\n<path d=\"M13 7H21M13 17H21M3 6C3 4.89543 3.89543 4 5 4H7C8.10457 4 9 4.89543 9 6V8C9 9.10457 8.10457 10 7 10H5C3.89543 10 3 9.10457 3 8ZM3 17L5 19L9 15\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\r\n</svg>","feedback":"<svg viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\r\n<path d=\"M4 16C2.038 12.076 3.211 7.309 6.77 4.744C10.329 2.179 15.223 2.574 18.325 5.675C21.426 8.777 21.821 13.671 19.256 17.23C16.691 20.789 11.924 21.962 8 20L3 21Z\" fill=\"currentColor\" fill-opacity=\"0.2\"/>\r\n<path d=\"M4 16C2.74097 13.48194 2.74097 10.51806 4 8C4.86548 6.26904 6.26904 4.86548 8 4C10.51806 2.74097 13.48194 2.74097 16 4C17.73096 4.86548 19.13452 6.26904 20 8C21.25903 10.51806 21.25903 13.48194 20 16C19.13452 17.73096 17.73096 19.13452 16 20C13.48194 21.25903 10.51806 21.25903 8 20L3 21Z\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\r\n</svg>","compact":"<svg viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\r\n<path d=\"M13 6H21M13 12H21M13 18H21M3 6L6 9L9 6M9 18L6 15L3 18\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\r\n</svg>","permission":"<svg viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\r\n<path d=\"M12 3H16C18.209 3 20 4.791 20 7V10C19.997 15.351 16.676 18.92 12 21C7.324 18.92 4.003 15.351 4 10V7C4 4.791 5.791 3 8 3Z\" fill=\"currentColor\" fill-opacity=\"0.2\"/>\r\n<path d=\"M12 3H16C18.20914 3 20 4.79086 20 7V10C20 15.5 16.5 19 12 21C7.5 19 4 15.5 4 10V7C4 4.79086 5.79086 3 8 3H12Z\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\r\n</svg>","model":"<svg viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\r\n<path d=\"M21 7C17.25 7 17 7.25 17 11C17 7.25 16.75 7 13 7C16.75 7 17 6.75 17 3C17 6.75 17.25 7 21 7ZM15 15C11.992 15.003 9.003 17.992 9 21C8.997 17.992 6.008 15.003 3 15C6.008 14.997 8.997 12.008 9 9C9.003 12.008 11.992 14.997 15 15Z\" fill=\"currentColor\" fill-opacity=\"0.2\"/>\r\n<path d=\"M9 9C9 12 12 15 15 15C12 15 9 18 9 21C9 18 6 15 3 15C6 15 9 12 9 9ZM17 3C17 6.75 17.25 7 21 7C17.25 7 17 7.25 17 11C17 7.25 16.75 7 13 7C16.75 7 17 6.75 17 3Z\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\r\n</svg>","export":"<svg viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\r\n<path d=\"M5 7C3.89543 7 3 7.89543 3 9V17C3 19.20914 4.79086 21 7 21H17C19.20914 21 21 19.20914 21 17V9C21 7.89543 20.10457 7 19 7M15 6L12 3L9 6M12 3V15\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\r\n</svg>"};
      const slashRole = (el) => {
        const alias = (el.querySelector(".pc3rQa_itemAlias, [class*='itemAlias']")?.textContent || "").trim().toLowerCase();
        const name = (el.querySelector(".pc3rQa_itemName, [class*='itemName']")?.textContent || "").trim().toLowerCase();
        const raw = ((el.getAttribute("aria-label") || "") + " " + (el.innerText || "")).toLowerCase();
        const key = alias || name;
        if (key === "file" || /^файл\b/.test(name) || /\bfile\b/.test(alias)) return "file";
        if (key === "goal" || /^goal\b/.test(name)) return "goal";
        if (key === "plan" || /^план\b/.test(name)) return "plan";
        if (key === "feedback" || /обратн/.test(name) || /feedback/.test(alias)) return "feedback";
        if (key === "compact" || /^compact\b/.test(name)) return "compact";
        if (key === "permission" || /^permission\b/.test(name) || /разрешен/.test(name)) return "permission";
        if (key === "model" || /^модель\b/.test(name)) return "model";
        if (key === "export" || /^экспорт\b/.test(name)) return "export";
        // fallbacks from full row text
        if (/\bfeedback\b|обратная связь/.test(raw)) return "feedback";
        if (/\bcompact\b/.test(raw) && /conversation history|истор/.test(raw)) return "compact";
        if (/\bpermission\b|sandbox mode/.test(raw)) return "permission";
        if (/\bexport\b|zip archive|экспорт/.test(raw)) return "export";
        if (/\bmodel\b|tide\s*\/\s*flare|модель/.test(raw) && /auto|tide|flare|pine/.test(raw)) return "model";
        if (/\bplan mode\b|\bplan\b/.test(raw) && /enter or leave|режим/.test(raw)) return "plan";
        if (/long-running task|\bgoal\b/.test(raw)) return "goal";
        if (/^файл\b|\bfile\b/.test(raw) && raw.length < 40) return "file";
        return null;
      };
      for (const el of root.querySelectorAll('button.pc3rQa_item, [role="option"].pc3rQa_item, button[class*="pc3rQa_item"]')) {
        const role = slashRole(el);
        if (!role || !SLASH[role]) continue;
        const svg = el.querySelector("svg");
        if (!svg || isMeter(svg)) continue;
        svg.removeAttribute("data-beam-cool");
        fillHost(svg, SLASH[role]);
        svg.setAttribute("data-beam-slash", role);
        svg.setAttribute("data-cool-name", role);
        svg.setAttribute("width", "16");
        svg.setAttribute("height", "16");
      }
    } catch (e) { console.warn("[beam-slash-menu]", e); }

    /* beam-folder-open-force */
    if (!root?.querySelectorAll) return;
    try {
      const FOLDER_CLOSED = "<svg viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\r\n<path d=\"M10 4L12 6H17C19.209 6 21 7.791 21 10V16C21 18.209 19.209 20 17 20H7C4.791 20 3 18.209 3 16V6C3 4.895 3.895 4 5 4Z\" fill=\"currentColor\" fill-opacity=\"0.2\"/>\r\n<path d=\"M12 6H17C19.20914 6 21 7.79086 21 10V16C21 18.20914 19.20914 20 17 20H7C4.79086 20 3 18.20914 3 16V6C3 4.89543 3.89543 4 5 4H10L12 6\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\r\n</svg>";
      const FOLDER_OPEN = "<svg viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\r\n<path d=\"M10 4L12 6H15C17.209 6 19 7.791 19 10V11C19.984 11 20.492 12.524 20 14L19 17C18.423 18.728 16.851 19.999 15 20H5C3.895 20 3 19.105 3 18V6C3 4.895 3.895 4 5 4Z\" fill=\"currentColor\" fill-opacity=\"0.2\"/>\r\n<path d=\"M5 20L7 14C7.59719 12.20843 9.20843 11 11 11H19C19.98392 11 20.49196 12.52412 20 14L19 17C18.40281 18.79157 16.79157 20 15 20H5ZM19 11V10C19 7.79086 17.20914 6 15 6H12L10 4H5C3.89543 4 3 4.89543 3 6V18C3 19.10457 3.89543 20 5 20\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\r\n</svg>";
      const FOLDER_OPEN_FILL = "<svg viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\r\n<path d=\"M20 10H11C9.899 10.003 8.83 10.364 7.952 11.028C7.063 11.699 6.4 12.626 6.051 13.684C5.877 14.208 6.16 14.774 6.684 14.949C7.208 15.123 7.774 14.84 7.949 14.316C8.391 12.991 9.573 12 11 12H21.103C21.268 12.765 21.195 13.577 20.949 14.316L19.949 17.316C19.237 19.452 17.281 21 15 21H5C3.343 21 2 19.657 2 18V6C2 4.343 3.343 3 5 3H10C10.265 3 10.52 3.105 10.707 3.293L12.414 5H15C17.761 5 20 7.239 20 10Z\" fill=\"currentColor\"/>\r\n</svg>";
      const looksFolderPath = (d) =>
        /M10 4L12 6H17C19\.209|M12 6H17C19\.209|M10 4L12 6H15C17\.209|M12\.414 5H17C19\.761|M20 10H11C9\.899|M9 2H12C12\.265|M2\.55912|M1\.50439 3\.11059|M20 20H4|folder-open|FolderOpen/i.test(d || "");
      const applyFolder = (svg, kind) => {
        if (!svg || isMeter(svg)) return;
        const markup = kind === "open-fill" ? FOLDER_OPEN_FILL : kind === "open" ? FOLDER_OPEN : FOLDER_CLOSED;
        svg.removeAttribute("data-beam-cool");
        fillHost(svg, markup);
        if (kind === "open" || kind === "open-fill") {
          svg.setAttribute("data-beam-folder-open", "1");
          svg.setAttribute("data-cool-name", "folder-open");
          svg.removeAttribute("data-beam-folder-header");
        } else {
          svg.setAttribute("data-beam-folder-header", "1");
          svg.setAttribute("data-cool-name", "folder");
          svg.removeAttribute("data-beam-folder-open");
        }
      };
      const isHeaderFolderHost = (svg) => {
        if (svg.closest(".wnFoaW_projectRow, [class*='projectRow'], [data-row-key^='workspace'], [data-row-key^='project']")) return true;
        if (svg.closest(".wnFoaW_folder, [class*='wnFoaW_folder']")) return true;
        const btn = svg.closest("button.WOwLGG_workspace, button[aria-label*='Выбрать проект'], button[aria-label*='Select project'], button[aria-label*='выбрать проект']");
        if (btn && !btn.closest('[role="menu"], [role="listbox"], [role="menuitem"]')) return true;
        return false;
      };
      for (const svg of root.querySelectorAll('svg[class*="folder"], svg.WOwLGG_folder, .wnFoaW_folder svg, [class*="folderChip"] svg, [class*="projectChip"] svg, [class*="projectRow"] svg, [data-row-key^="workspace"] svg, [data-row-key^="project"] svg')) {
        if (isMeter(svg)) continue;
        const cls = svg.getAttribute("class") || "";
        if (/arrow|chevron|caret|expand|plus/i.test(cls)) continue;
        const host = svg.closest("button,[role=button],a,[role='treeitem']") || svg.parentElement;
        const lab = ((host?.getAttribute("aria-label") || "") + " " + (host?.innerText || "")).toLowerCase();
        if (/правк|доступ|access|permission|edit mode|новая сессия|new session|add session/.test(lab)) continue;
        if (/iconbutton/i.test(host?.className || "") && !/folder/i.test(cls) && !svg.closest(".wnFoaW_folder")) continue;
        if (isHeaderFolderHost(svg)) applyFolder(svg, "closed");
      }
      for (const btn of root.querySelectorAll('button[aria-label*="Выбрать проект"], button[aria-label*="Select project"], button[aria-label*="выбрать проект"], button.WOwLGG_workspace')) {
        if (btn.closest('[role="menu"], [role="listbox"]')) continue;
        const svg = btn.querySelector('svg[class*="folder"], svg:not([class*="chevron"]):not([class*="arrow"])');
        if (svg) applyFolder(svg, "closed");
      }
      for (const el of root.querySelectorAll('[role="menuitem"], [role="option"]')) {
        if (el.closest(".pc3rQa_item, [class*='pc3rQa_item']")) continue;
        if (!el.closest('[role="menu"], [role="listbox"], [class*="_surface_"], [class*="Popover"], [class*="portal"]')) continue;
        const svg = el.querySelector("svg");
        if (!svg || isMeter(svg)) continue;
        const cls = svg.getAttribute("class") || "";
        if (/arrow|chevron|caret|plus|check/i.test(cls)) continue;
        const d0 = svg.querySelector("path")?.getAttribute("d") || "";
        if (looksFolderPath(d0) || /folder/i.test(cls)) applyFolder(svg, "open");
      }
      for (const svg of root.querySelectorAll("svg")) {
        if (isMeter(svg) || isHeaderFolderHost(svg)) continue;
        if (svg.getAttribute("data-beam-slash")) continue;
        const d0 = svg.querySelector("path")?.getAttribute("d") || "";
        if (!looksFolderPath(d0) && !/folder/i.test(svg.getAttribute("class") || "")) continue;
        const w = parseFloat(svg.getAttribute("width") || "0");
        if (w >= 40) continue;
        if (svg.closest('[data-sidebar-right-guide-entry="files"]')) {
          applyFolder(svg, "open-fill");
          svg.setAttribute("width", "26");
          svg.setAttribute("height", "26");
          svg.setAttribute("data-beam-guide", "files");
          continue;
        }
        if (looksFolderPath(d0)) applyFolder(svg, "open");
      }
    } catch (e) { console.warn("[beam-folder-open]", e); }
  };

  let scheduled = false;
  const run = () => {
    scheduled = false;
    try { replaceIn(document); } catch (e) { console.warn("[beam-cool-inline]", e); }
    try { folderSplit(document); } catch (e) { console.warn("[beam-folder-split]", e); }
  };
  const kick = () => {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(run);
  };
  const boot = () => {
    run();
    new MutationObserver((muts) => {
      for (const m of muts) {
        if (m.addedNodes && m.addedNodes.length) { kick(); return; }
      }
    }).observe(document.documentElement, { childList: true, subtree: true });
  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
